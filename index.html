:root{--bg:#090808;--base:#15110f;--pane:#171310;--raised:#271c18;--line:#65492e;--gold:#e4bb7d;--gold-dim:#9e703a;--text:#f3e5cd;--muted:#bbac98;--soft:#d7c7af;--shade:#080708;--cream:#f3e5cd;--radius:4px;--oxblood:#501915;--violet:#724187}

/* WAXSKULL DESIGN V4 - faithful visual reconstruction of the approved mockup,
   retaining real session history, approved portraits and read-only character data. */
:root{--bg:#070608;--base:#0e0b0b;--pane:#151010;--raised:#240f0f;--line:#835d36;--gold:#e7c88d;--gold-dim:#ad7d48;--text:#f4e7d1;--muted:#c5b49c;--soft:#e3d3b5;--oxblood:#6b1315;--cream:#f5ebd9;--radius:1px}
html,body{background:#090708;color:#f2e7d5;font-family:Georgia,'Times New Roman',serif}
body{background-image:radial-gradient(ellipse 36% 21% at 45% 1%,#3d211b33,transparent),radial-gradient(ellipse 35% 35% at 101% 50%,#20101e38,transparent),linear-gradient(180deg,#0c090c,#050507 100%);background-attachment:fixed}
.site{max-width:1770px;padding:0 25px 30px;overflow:hidden}
.header{position:sticky;top:0;z-index:50;height:57px;min-height:57px;margin:0 -25px;gap:30px;padding:0 5.2%;border:none;border-bottom:1px solid #ae8350;box-shadow:0 3px 14px #000d;background:linear-gradient(180deg,#0b090a,#090709 90%);}
.header:after{content:'';position:absolute;bottom:-3px;left:7%;right:7%;height:1px;background:linear-gradient(90deg,transparent,#ae814f77,transparent);pointer-events:none}
.brand{gap:12px}.brand-icon{width:42px;height:45px;display:grid;place-items:center;border:0;background:none;box-shadow:none}.brand-icon img{width:34px;height:43px;object-fit:contain;filter:drop-shadow(0 0 4px #e1b87031)}
.brandname{font:normal 23px/1.05 Georgia,serif;letter-spacing:.06em;color:#f0e1c3}.brandsub{font-size:10px;letter-spacing:.28em;color:#c69a56;margin-top:3px}
.topnav{gap:26px;background:none;border:0;border-radius:0;padding:0;align-self:stretch;align-items:center;justify-content:center;flex:1}
.navbtn{position:relative;color:#e5d3b7;background:transparent;border:1px solid transparent;border-radius:0;font:normal 14px/1 Georgia,serif;letter-spacing:.10em;text-transform:uppercase;padding:11px 17px;min-width:84px}
.navbtn:hover{color:#ffeac3;background:#33140f50}
.navbtn.active{color:#ffe6b1;border-color:#a36b39;background:linear-gradient(180deg,#681316,#330c0b 85%);box-shadow:inset 0 0 0 2px #1a0c08,inset 0 0 0 3px #9b622e80,0 0 14px #9c33223d;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.headerend{gap:12px;min-width:180px;justify-content:end;color:#deba73;border-left:1px solid #6b4a32;padding-left:16px}.header-insignia{font-size:27px;color:#d2a561}.header-end-label{font:normal 11px Georgia,serif;letter-spacing:.12em;color:#e9bc73}.readonly-icon{display:none}
.main{padding-top:0}.home-stage{position:relative;isolation:isolate;padding-bottom:27px}
.home-stage:after{content:'';position:absolute;z-index:0;bottom:-6px;left:-25px;width:calc(100% + 50px);height:180px;pointer-events:none;background-image:var(--footer-props);background-size:100% 180px;background-position:center bottom;background-repeat:no-repeat;opacity:.92}
.wax-v4-home > *{position:relative;z-index:1}
.wax-hero{height:253px;min-height:253px;display:flex;align-items:center;justify-content:center;border:0;border-bottom:1px solid #b3854b76;box-shadow:none;overflow:hidden;background-image:radial-gradient(ellipse 29% 75% at 50% 35%,#2b1f1844,transparent 98%),var(--hero-art),linear-gradient(180deg,#100a0c 0%,#080709 90%);background-position:center,center top,center;background-size:100% 100%,100% 100%,cover;background-repeat:no-repeat}
.wax-hero:before{content:'';position:absolute;inset:0;left:25%;right:25%;width:auto;height:auto;opacity:.43;background:repeating-radial-gradient(circle at 50% 46%,transparent 0 39px,#95652e40 40px 40.5px,transparent 41px 63px),repeating-conic-gradient(from 0deg at 50% 45%,transparent 0deg 27deg,#d8a76020 27.4deg 27.9deg,transparent 28.2deg 45deg);transform:none;pointer-events:none}
.wax-hero:after{content:'◆';position:absolute;left:50%;top:auto;bottom:-13px;width:30px;height:21px;margin-left:-15px;text-align:center;font-size:18px;color:#a41d22;text-shadow:0 1px 4px #000,0 0 2px #dda76b;background:transparent;pointer-events:none}
.wax-drip,.hero-candle{display:none!important}
.hero-center{z-index:3;position:relative;text-align:center;padding:0 8px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(0)}
.crest-orbit{border:0;box-shadow:none;background:none;width:170px;height:142px;display:grid;place-items:center;transform:none;position:relative;margin:0 auto -1px}
.crest-orbit:before{content:'';position:absolute;inset:14px 12px;border:1px solid #b28a5463;transform:rotate(45deg) scale(.79);box-shadow:0 0 0 35px #b28a5407}
.crest-orbit img{height:145px;width:145px;object-fit:contain;position:relative;z-index:2;filter:brightness(1.22) drop-shadow(0 3px 7px #000)}
.wax-hero h1{font:normal clamp(36px,4.0vw,58px)/1.03 Georgia,'Times New Roman',serif;letter-spacing:.105em;text-transform:uppercase;color:#f7ebd4;margin:0 0 6px;text-shadow:0 3px 7px #000,0 0 25px #dfa35625}
.wax-hero .hero-divider{width:350px;max-width:70vw;height:13px;margin:0;display:flex;align-items:center;justify-content:center;position:relative;color:#b9272f}
.wax-hero .hero-divider:before,.wax-hero .hero-divider:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,#a7793c);margin:0 10px}
.wax-hero .hero-divider:after{transform:scaleX(-1)}
.wax-hero .hero-divider span{font-size:11px;text-shadow:0 0 8px #a32229}
.wax-hero p{font:normal 11px/1.4 Georgia,serif;color:#d9ad6c;letter-spacing:.30em;text-transform:uppercase;margin:2px 0 0}
.ribbon-head{display:none}
.party-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:6px 49px 0}
.party-card{position:relative;min-width:0;grid-template-columns:46% 54%;height:216px;background:#100c10;border:1px solid #bb8e52;box-shadow:inset 0 0 0 3px #090708,inset 0 0 0 4px #89623c4a,0 5px 20px #000c;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);transition:transform .2s,border-color .2s,filter .2s}
.party-card:hover{transform:translateY(-3px);border-color:#f0c481;filter:brightness(1.13);box-shadow:0 4px 28px #803f224f}
.party-card:after{content:'';position:absolute;inset:6px;border:1px solid #e4b37547;pointer-events:none;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.party-photo{height:100%;min-width:0;background:#181014}
.party-photo:before{content:'';position:absolute;z-index:1;inset:7px -10px -55px 7px;border:1px solid #c0924b5b;border-radius:50%;box-shadow:0 0 0 14px #d2a25d0c,0 0 0 42px #d2a25d09;pointer-events:none}
.party-photo:after{background:linear-gradient(90deg,transparent 67%,#100a0df2),linear-gradient(0deg,#100a0d9a,transparent 29%)}
.party-photo img{filter:contrast(1.03) saturate(.91);object-fit:cover;width:100%;height:100%;object-position:center 23%}
.party-gorian .party-photo img{object-position:center 20%}.party-rey .party-photo img{object-position:center 22%}.party-white .party-photo img{object-position:center 22%}
.party-data{z-index:2;display:flex;flex-direction:column;align-items:flex-start;padding:29px 10px 9px 1px;gap:0;background:radial-gradient(ellipse at 100% 22%,#3f1c181f,transparent 58%);min-width:0}
.party-name{font:normal clamp(21px,1.86vw,30px)/1 Georgia,serif;letter-spacing:.04em;color:#f6e3c3;text-transform:uppercase;display:block;margin:0 0 9px;text-shadow:0 1px 2px #000}
.party-role{font:normal 12px/1.25 Georgia,serif;color:#f0d5ae;white-space:normal}
.party-race{font:normal 11px/1.3 Georgia,serif;color:#b9a78f;margin-top:3px;min-height:14px}
.party-figures{display:flex;align-items:center;gap:4px;margin-top:12px;width:100%;justify-content:flex-start}
.wax-stat{display:grid;place-items:center;width:47px;height:55px;flex:0 0 47px;padding:1px;background:linear-gradient(160deg,#e1bd7b,#79572c 80%,#bb9354);clip-path:polygon(50% 0%,96% 22%,96% 77%,50% 100%,4% 77%,4% 22%)}
.wax-stat-inside{width:100%;height:100%;background:#100d0e;clip-path:polygon(50% 0%,96% 22%,96% 77%,50% 100%,4% 77%,4% 22%);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:7px 1px 6px}

/* WAXSKULL V4.1: mobile character sheets must never inherit a 575px min-content width. */
@media (max-width: 900px) {
  .sheettabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px 8px;
    overflow: visible;
  }
  .sheettabs .tab {
    min-width: 0;
    width: 100%;
    padding: 10px 7px;
    white-space: normal;
    overflow-wrap: break-word;
    text-align: center;
    line-height: 1.3;
  }
}
@media (max-width: 760px) {
  .char-layout {
    grid-template-columns: minmax(0, 1fr) !important;
    min-width: 0;
    width: 100%;
  }
  .char-layout > .sidebar,
  .char-layout > .sheet,
  .sheetgrid,
  .sheetmain,
  .infoaside,
  .panelcard {
    min-width: 0;
    max-width: 100%;
  }
  .sidebar .people {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
    min-width: 0;
    gap: 7px;
    overflow: visible;
  }
  .sidebar .personbtn {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr);
    width: 100%;
    min-width: 0;
    max-width: 100%;
    gap: 7px;
    margin: 0;
    padding: 7px 6px;
  }
  .sidebar .personbtn strong,
  .sidebar .personbtn small {
    min-width: 0;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  .sidebar .smallportrait { width: 36px; height: 36px; }
  .sheethead { grid-template-columns: 96px minmax(0, 1fr); }
  .sheethead > * { min-width: 0; }
  .sheethead .headtags .pill {
    max-width: 100%;
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.3;
  }
  .statstrip,
  .abilities,
  .skills,
  .equipment,
  .simplegrid { min-width: 0; max-width: 100%; }
  .skill { grid-template-columns: 18px minmax(0, 1fr) 44px; }
  .skill > span { min-width: 0; overflow-wrap: break-word; }
  .skill button { min-width: 38px; padding: 6px 0; text-align: right; }
  .panelcard .item, .panelcard .minirow, .panelcard .simpleitem,
  .panelcard .equipment div { min-width: 0; overflow-wrap: anywhere; }
  .panelcard .minirow > * { min-width: 0; }
  .panelcard .minirow strong { text-align: right; }
}
@media (max-width: 420px) {
  .sheethead { grid-template-columns: 80px minmax(0, 1fr); gap: 10px; padding: 12px; }
  .sheethead .portrait { width: 80px; height: 96px; }
  .sheethead h1 { font-size: 30px; line-height: 1.05; }
  .sheethead p { font-size: 11px; line-height: 1.45; }
  .statstrip, .abilities { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .statstrip .stat-tile:last-child { grid-column: 1 / -1; }
  .panelcard { padding: 14px 13px; }
  .equipment { grid-template-columns: 1fr; }
  .panelcard .contentrow { flex-wrap: wrap; }
  .stat-tile .lbl { overflow-wrap: break-word; }
}

"toHit":"TS SAG CD 12","damage":"1d8 / 1d12 necrotici","range":"18 m","cost":"Nessuno slot","notes":"Non è un tiro per colpire: Hex non si applica."},{"name":"Colpo senz'armi","time":"Azione Attacco","desc":"Tira 1d20 + 1; danno base 1 + FOR (-1), quindi 0 prima di altri effetti.","toHit":"+1","damage":"0 contundenti","range":"1,5 m","cost":"Nessuno slot"}],"features":[{"name":"Maledizione dell'Hexblade (Hexblade's Curse)","time":"Azione bonus","desc":"Maledici un nemico visibile: +2 ai tuoi tiri di danno contro di lui, critico con 19–20 naturale e 5 PF recuperati se muore.","cost":"1 / riposo breve o lungo · nessuno slot","range":"9 m","duration":"1 minuto","concentration":"No","steps":["Scegli una creatura visibile entro 9 m; nessun tiro o TS.","Aggiungi +2 ai tuoi tiri di danno contro il bersaglio; critico con 19–20.","Se il bersaglio muore recuperi 5 PF (livello 3 + CAR 2). La maledizione finisce anche se muori o sei incapacitato."],"notes":"Diversa da Hex: non consuma slot e non richiede concentrazione; non si trasferisce."},{"name":"Passo Fatato (Misty Step)","time":"Azione bonus","desc":"Ti teletrasporti in uno spazio libero e visibile entro 9 m.","cost":"1 / riposo breve o lungo · nessuno slot","range":"9 m","duration":"Istantanea","concentration":"No","steps":["Scegli uno spazio libero visibile.","Teletrasportati: non provochi attacchi di opportunità.","Segna l'uso razziale."],"notes":"Come incantesimo da azione bonus limita le altre magie del turno a trucchetti da 1 azione."},{"name":"Vista del Diavolo (Devil's Sight)","time":"Passivo","desc":"Vedi normalmente nell'oscurità magica e non magica entro 36 m.","range":"36 m","notes":"La scurovisione razziale è distinta (18 m). Non rende invisibile."},{"name":"Guerriero dell'Hexblade (Hex Warrior)","time":"Dopo riposo lungo","desc":"Scegli un'arma con cui sei competente e senza proprietà a due mani: puoi usare CAR per colpire e danni. Con i pugnali DES +3 è attualmente più efficace di CAR +2."},{"name":"Colpo Sicuro (runa)","time":"Durante un tuo attacco","desc":"Un singolo attacco va a segno senza tiro per colpire.","cost":"1 / riposo lungo","steps":["Dichiara al Master l'uso della runa per l'attacco.","Tira normalmente i danni; non è un critico automatico.","Recupera l'uso al riposo lungo."]},{"name":"Patto della Catena — evocare Dagon","time":"Azione","desc":"Richiama Dagon da un'ombra entro 9 m. Il congedo richiede un'azione. A 0 PF non può essere richiamato fino al riposo lungo.","range":"9 m","cost":"Nessuno slot o materiale","duration":"Illimitata","concentration":"No","companion":true,"steps":["Scegli un'ombra esistente di giorno o un punto in penombra/oscurità di sera/notte.","Spendi un'azione per manifestarlo; può poi muoversi anche in piena luce."]},{"name":"Maestro della Catena (Investment of the Chain Master)","time":"Azione bonus / reazione","desc":"Comanda il morso con l'azione bonus; in alternativa rinuncia a un attacco dell'azione Attacco e Dagon usa la propria reazione. Proteggilo con la tua reazione e un utilizzo.","cost":"Attacco senza slot · Protezione 2 / riposo lungo","steps":["Dagon agisce subito dopo di te. Massimo un attacco per round.","Il morso impone TS FOR CD 12; attacchi magici ai fini delle resistenze agli attacchi non magici.","Quando Dagon subisce danno spendi la tua reazione e 1 dei 2 utilizzi di Protezione per dimezzarlo."],"notes":"Le due reazioni sono separate. Movimento d'Ombra sostituisce volo/nuoto. Protezione recuperata solo con riposo lungo.","companion":true},{"name":"Retaggio Fatato e Trance","time":"Passivo","desc":"Vantaggio ai TS contro charme; il sonno magico non ti addormenta. Trance: mediti per 4 ore invece di dormire."}],"cantrips":[{"name":"Illusione Minore (Minor Illusion)","time":"Azione","desc":"Crea un suono oppure l'immagine immobile di un oggetto entro un cubo di 1,5 m.","tier":"Trucchetto","cost":"Nessuno slot","range":"9 m","duration":"1 minuto","concentration":"No","components":"S, M","steps":["Scegli suono O immagine, non entrambi. L'immagine non produce rumore, luce o odore.","Esaminarla con un'azione permette Investigazione CD 12; il contatto fisico smaschera l'immagine.","Finisce allo scadere del minuto, se la congedi con un'azione o la rilanci."],"example":"Imita passi dietro una guardia, oppure crea una cassa dietro cui provare a nasconderti.","notes":"Non garantisce vantaggio, perdita del turno o copertura fisica; il Master valuta la situazione. Nessuna componente verbale."},{"name":"Rintocco dei Morti (Toll the Dead)","time":"Azione","desc":"Una creatura visibile effettua TS SAG CD 12. Se fallisce: 1d8 necrotici, oppure 1d12 se le mancano PF.","tier":"Trucchetto","range":"18 m","duration":"Istantanea","concentration":"No","cost":"Nessuno slot","components":"V, S","steps":["Scegli un bersaglio visibile.","TS SAG CD 12: successo, nessun danno; fallimento, 1d8 se a PF pieni, altrimenti 1d12."],"notes":"Non è un tiro per colpire: Hex non si applica, non può fare critico."}],"spells":[{"name":"Sortilegio (Hex)","time":"Azione bonus","desc":"Maledici un nemico visibile: ogni tuo attacco a segno contro di lui infligge 1d6 necrotico extra. Inoltre avrà svantaggio alle prove di una caratteristica scelta.","tier":"1° · slot di 2°","cost":"1 slot del Patto","range":"27 m","duration":"Fino a 1 ora","concentration":"Sì","components":"V, S, M","featured":true,"steps":["Spendi l'azione bonus e 1 dei 2 slot del Patto. Scegli una creatura visibile entro 27 m; nessun tiro per colpire o TS.","Scegli FOR, DES, COS, INT, SAG o CAR: svantaggio alle PROVE di quella caratteristica, non ai tiri salvezza.","Ogni volta che TU colpisci il bersaglio con un attacco, aggiungi 1d6 necrotici. Vale anche per il secondo pugnale.","Se il bersaglio scende a 0 PF mentre la magia è attiva, in un tuo turno successivo puoi trasferire Hex a un'altra creatura con un'azione bonus. Non devi ucciderla tu e non spendi un altro slot.","Dopo ogni danno subito: TS COS +2, CD 10 o metà dei danni (il maggiore); se fallisci Hex finisce."],"example":"Turno 1: bonus Hex, azione Pugnale. Se colpisci: 1d4 + 3 perforanti + 1d6 necrotici. Turno 2: due pugnali (Hex su entrambi se colpiscono) OPPURE pugnale e comando di Dagon.","notes":"Non aggiunge danni a Rintocco dei Morti, al morso di Dagon o ad Agathys. Hex e Shadow Blade non coesistono perché richiedono concentrazione. Hex e Maledizione dell'Hexblade possono coesistere, usando la bonus in turni diversi."},{"name":"Armatura di Agathys (Armor of Agathys)","time":"Azione","desc":"Ottieni 10 PF temporanei per un'ora; chi ti colpisce con un attacco in mischia mentre li possiedi subisce 10 danni da freddo.","tier":"1° · slot di 2°","cost":"1 slot del Patto","range":"Sé","duration":"1 ora","concentration":"No","components":"V, S, M","steps":["Spendi uno slot e ottieni 10 PF temporanei, non reali.","Quando vieni colpito in mischia mentre hai ancora PF temporanei di Agathys, l'attaccante prende 10 freddo anche se il colpo li esaurisce.","Sottrai prima dai PF temporanei, poi da quelli reali; una volta esauriti, niente altri danni di risposta."],"example":"Morso da 12: perdi 10 PF temporanei e 2 reali; l'attaccante subisce comunque 10 freddo.","notes":"Non richiede concentrazione. I PF temporanei non si sommano."},{"name":"Lama d'Ombra (Shadow Blade)","time":"Azione bonus","desc":"Evoca una lama magica leggera, accurata e da lancio. Con DES +3: +5 al colpire, 2d8 + 3 psichici.","tier":"2°","cost":"1 slot del Patto","range":"Sé","duration":"Fino a 1 minuto","concentration":"Sì","components":"V, S","steps":["Spendi uno slot e la bonus per creare la lama in mano.","Azione Attacco: tira 1d20 + 5; vantaggio contro bersaglio in penombra/oscurità. A segno 2d8 + 3 psichici.","Puoi lanciarla 6/18 m (svantaggio oltre 6 m). Se la lasci o la lanci, svanisce a fine turno; puoi ricrearla con azione bonus mentre la magia dura.","Mantieni la concentrazione."],"example":"Turno 1: crea la lama e attacca. Dal turno seguente: attacca con la lama e comanda Dagon con la bonus.","notes":"Incompatibile con Hex per concentrazione. Creare o ricreare la lama occupa la stessa azione bonus del comando di Dagon."},{"name":"Immagine Speculare (Mirror Image)","time":"Azione","desc":"Tre duplicati illusori possono intercettare gli attacchi contro di te. CA dei duplicati 13.","tier":"2°","cost":"1 slot del Patto","range":"Sé","duration":"1 minuto","concentration":"No","components":"V, S","steps":["Spendi uno slot, crea tre duplicati.","Ogni volta che sei bersaglio di un attacco tira 1d20: con 3 copie serve 6+, con 2 copie 8+, con 1 copia 11+ per deviare il colpo.","Se deviato, confronta l'attacco con CA 13 della copia. Se colpisce, distruggi la copia; se manca, nessun effetto.","Termina quando tutte le copie sono distrutte o dopo un minuto."],"example":"Con 3 copie tiri 9: attacco deviato. Se l'attacco ottiene 15, una copia sparisce e tu non subisci quel colpo.","notes":"Non protegge dagli effetti ad area o da chi ignora le illusioni tramite sensi appropriati. Può coesistere con Hex o Shadow Blade."}],"resources":[{"id":"slot2","label":"Slot del Patto (2°)","max":2,"hint":"Entrambi di 2° livello. Recuperati con riposo breve o lungo."},{"id":"curse","label":"Maledizione Hexblade","max":1,"hint":"1 uso per riposo breve o lungo."},{"id":"fey","label":"Passo Fatato","max":1,"hint":"1 uso per riposo breve o lungo."},{"id":"rune","label":"Colpo Sicuro","max":1,"hint":"1 uso per riposo lungo."},{"id":"protection","label":"Protezione di Dagon","max":2,"hint":"2 usi per riposo lungo; ogni uso richiede la reazione."}],"equipment":["2 pugnali","Armatura di cuoio (indossata)","Focus arcano","Zaino, 10 razioni, corda, 10 torce","Anello misterioso (1)","Libro della chiesa: Frul, Ctar, Semek, Ptulak, Gianni","Corda recuperata all'accampamento","3 MO raccolte all'accampamento","Abiti da viaggio, sacchetto, piede di porco, martello, 10 chiodi da roccia, acciarino e otre"],"inventoryNote":"","language":"Comune, Elfico, Silvano"},

const TRACK_PREFIX='waxskull.players.tracker.v1.';
let trackingStorageOK=true;
function resourcesFor(id){
 const c=id==="dagon"?null:CHARACTERS[id];

 return [...base,...extras.filter(r=>!base.some(b=>b.id===r.id))];
}
function trackSpec(key){
 const [id,field,...rest]=String(key).split('.');
 if(rest.length||(!Object.prototype.hasOwnProperty.call(CHARACTERS,id)&&id!=='dagon'))return null;
 const name=id==='dagon'?'Dagon':CHARACTERS[id].name;
 const hpMax=id==='dagon'?DAGON.hp:CHARACTERS[id].hp;
 if(field==='hp')return {id,field,key:nameKey(id,field),label:name+' — PF attuali',max:hpMax};
 if(field==='temp')return {id,field,key:nameKey(id,field),label:name+' — PF temporanei',max:null};
 const r=resourcesFor(id).find(x=>x.id===field);
 return r?{id,field,key:nameKey(id,field),label:name+' — '+r.label+' disponibili',max:r.max}:null;
}
function nameKey(id,field){return id+'.'+field}
function allTrackingKeys(){return [...Object.keys(CHARACTERS),'dagon'].flatMap(id=>['hp','temp',...resourcesFor(id).map(r=>r.id)].map(field=>nameKey(id,field)))}
function readTracked(spec){
 if(!spec)return 0;
 const raw=spec.field==='hp'?state.hp[spec.id]:spec.field==='temp'?state.temp[spec.id]:state.resources[spec.id]?.[spec.field];
 return cleanTracked(raw,spec.max);
}
function cleanTracked(raw,max){
 if(raw===null||raw===undefined||String(raw).trim()==='')return 0;
 const n=Number(raw);
 if(!Number.isFinite(n))return 0;
 return Math.max(0,Math.min(max===null?Number.MAX_SAFE_INTEGER:max,Math.trunc(n)));
}
function putTracked(spec,value){
 if(spec.field==='hp')state.hp[spec.id]=value;
 else if(spec.field==='temp')state.temp[spec.id]=value;
 else {if(!state.resources[spec.id])state.resources[spec.id]={};state.resources[spec.id][spec.field]=value;}
}
function restoreTracking(){
 for(const key of allTrackingKeys()){
  const spec=trackSpec(key);let raw=readTracked(spec);
  try{const saved=window.localStorage.getItem(TRACK_PREFIX+key);if(saved!==null)raw=saved;}
  catch(e){trackingStorageOK=false;}
  putTracked(spec,cleanTracked(raw,spec.max));
 }
}
function updateStorageNotice(){

function syncTracker(spec,source){
 const v=readTracked(spec);
 document.querySelectorAll('[data-track-key]').forEach(el=>{
  if(el.dataset.trackKey!==spec.key)return;
  const input=el.querySelector('[data-track-input]');
  if(input&&input!==source)input.value=String(v);
  const minus=el.querySelector('[data-track-step="-1"]'),plus=el.querySelector('[data-track-step="1"]');
  if(minus)minus.disabled=v<=0;
  if(plus)plus.disabled=spec.max!==null?v>=spec.max:v>=Number.MAX_SAFE_INTEGER;
 });
 if(spec.field==='hp')document.querySelectorAll('[data-hp-fill]').forEach(el=>{
  if(el.dataset.hpFill!==spec.id)return;
  el.style.width=Math.max(0,Math.min(100,v/spec.max*100))+'%';
  const bar=el.parentElement;if(bar)bar.setAttribute('aria-valuenow',String(v));
 });
}
function setTracked(key,raw,{persist=true,source=null}={}){

}
function trackerControl(id,field){

function handleTrackInput(e){
 const el=e.target.closest('[data-track-input]');if(!el)return;

 const spec=trackSpec(wrap.dataset.trackKey);if(!spec)return;
 const raw=el.value;
 if(e.type==='input'&&raw.trim()===''){
  // Allow clearing while editing, but the stored value is already zero.
  setTracked(spec.key,0,{source:el});return;

}
function handleTrackStep(e){
 const el=e.target.closest('[data-track-step]');if(!el)return false;
 const wrap=el.closest('[data-track-key]'),spec=wrap&&trackSpec(wrap.dataset.trackKey);
 if(!spec||el.disabled)return true;

function handleTrackingStorage(e){

 ];
 return `<div class="home-stage wax-v4-home">
  <section class="wax-hero" aria-label="Teschi di Cera"><div class="hero-center">
   <div class="crest-orbit"><img src="${state.logo}" alt="Logo originale WaxSkull: teschio geometrico"></div>
   <h1>TESCHI DI CERA</h1>
   <div class="hero-divider" aria-hidden="true"><span>◆</span></div>
   <p>CAMPAGNA D&amp;D NELL'UNIVERSO WAXSKULL</p>
  </div></section>
  <section class="party-cards" aria-label="I quattro protagonisti">${['elara','gorian','rey','white'].map(id=>{const c=CHARACTERS[id];return `<button class="party-card party-${id}" type="button" data-open-char="${id}" aria-label="Apri la scheda di ${c.name}"><span class="party-photo">${portrait(id)}</span><span class="party-data"><span class="party-name">${esc(c.name)}</span><span class="party-role">${esc(c.className)} · Livello ${c.level}</span><span class="party-race">${esc(c.race)}</span><span class="party-figures" aria-label="Tre caratteristiche del personaggio">${heroStats(id,c)}</span><span class="party-meta">CA ${c.ac} <span class="wax-dot">◆</span> PF MAX ${c.hp}</span></span></button>`}).join('')}</section>
  <section class="session-feature" aria-label="Ultima sessione giocata"><div class="session-seal" aria-hidden="true"></div><div class="session-info"><span class="eyebrow">ULTIMA SESSIONE <span class="wax-diamond">◆</span> 10 NOVEMBRE 2026</span><h2>La galleria e il campo devastato</h2><p>Dopo la stanza nascosta e lo scontro con quattro scheletri, il gruppo è riunito. Oltre la galleria: un accampamento distrutto, i morti e le braci ancora ardenti.</p></div><div class="session-art" aria-hidden="true"></div><button class="btn wax-button" type="button" data-page="diario">LEGGI IL RESOCONTO <span aria-hidden="true">⟶</span></button></section>
  <section class="quick-grid" aria-label="Esplora il portale">${tileContent.map(t=>`<button type="button" class="quick-tile quick-${t.page}" data-page="${t.page}"><span class="tile-photo tile-art-${tileArt[t.page]}" aria-hidden="true"></span><span class="tile-panel"><span class="tile-icon" aria-hidden="true">${t.symbol}</span><span class="tile-name">${t.label}</span><span class="tile-sub">${t.desc}</span><span class="tile-arrow" aria-hidden="true">›</span></span></button>`).join('')}</section>
  <div class="home-ornament" aria-hidden="true"><span>◆</span></div>
  
 </div>`;
}

function renderDiary(){return `<section class="page-banner diary-banner"><div class="eyebrow">WAXSKULL / DIARIO</div><h1>Le cronache del gruppo</h1><p>Le cronache del vostro viaggio.</p><div class="banner-sigil" aria-hidden="true">&#10022;</div></section><div class="sectionhead"><div><div class="eyebrow">Cronaca / Sessione 10.11.2026</div><h2>Quello che avete vissuto</h2></div></div>
<div class="layout2"><article class="card storycard"><div class="eyebrow">Ultima sessione</div><h3>Tra le pareti della montagna</h3><p class="storyintro">Elara cerca Altea nella galleria, mentre White, Rey e Gorian si ricongiungono. Il richiamo di Elara attraverso la galleria e un varco nascosto cambiano il corso del viaggio.</p><div class="gold-rule"></div>
<div class="timeline"><div class="step"><span class="stepbadge">1</span><div class="steptext"><strong>Il gruppo si ritrova</strong><p>Elara raggiunge l'uscita della galleria senza trovare Altea e la chiama ad alta voce, storpiandone il nome in \u00abAlbenga\u00bb. Rey, White e Gorian sentono il richiamo e si dirigono verso di lei.</p></div></div>
<div class="step"><span class="stepbadge">2</span><div class="steptext"><strong>La parete nascosta</strong><p>White recupera 10 pezzi d'ossidiana da una roccia spezzata. Dopo aver chiamato Altea in una rientranza sente la voce ovattata di Elara che chiama dalla parte opposta della galleria. Rey nota una melma mimetizzata con la parete; White la distrugge, aprendo l'accesso a una camera laterale.</p></div></div>
<div class="step"><span class="stepbadge">3</span><div class="steptext"><strong>Una scoperta inquietante</strong><p>Dietro il varco si distinguono i piedi e parte delle gambe di Altea. Il resto del corpo \u00e8 nascosto sotto un enorme masso.</p></div></div>
<div class="step"><span class="stepbadge">4</span><div class="steptext"><strong>Quattro scheletri</strong><p>Il rumore risveglia quattro scheletri, alcuni provenienti da fessure nascoste nella parete. L'odore dei cadaveri emerge dopo la distruzione della melma. Tre scheletri vengono distrutti; White intrappola il quarto facendo crollare la fessura del muro che era coperta dalla melma.</p></div></div>
<div class="step"><span class="stepbadge">5</span><div class="steptext"><strong>Di nuovo insieme</strong><p>Gorian racconta agli altri quanto ha vissuto durante la separazione e indica Vibruyl come sua meta. Elara recupera il proprio bastone magico, precedentemente raccolto da White.</p></div></div>
<div class="step"><span class="stepbadge">6</span><div class="steptext"><strong>Il campo devastato</strong><p>Usciti dalla galleria, i quattro raggiungono un accampamento distrutto. Vedono corpi senza vita e un focolare spento con braci ancora ardenti.</p></div></div></div></article>
<aside class="stack"><div class="card at-glance"><div class="eyebrow">Dove siete rimasti</div><h3 style="margin:8px 0 12px">Il prossimo passo \u00e8 vostro</h3><div class="simplelist"><div class="simpleitem"><b>Posizione</b><p>Accampamento distrutto, oltre la galleria montana. Non avete ancora esaminato in dettaglio la scena.</p></div><div class="simpleitem"><b>Compagni presenti</b><p>White, Gorian, Rey, Elara. Il gruppo \u00e8 finalmente riunito.</p></div><div class="simpleitem"><b>Questioni aperte</b><p>Che cosa \u00e8 accaduto al campo?</p></div></div></div><div class="card at-glance"><div class="eyebrow">Momento della serata</div><h3 style="margin:8px 0 11px">\u00abMi son sempre piaciuti i secchi\u00bb</h3><p class="muted" style="line-height:1.7;font-size:12px">Rey, rivolgendosi a uno scheletro durante il combattimento.</p></div></aside></div>
`;}
function charPageTabs(){const tabs=[["statistiche","Statistiche"],["combattimento","Combattimento"],["magie","Magie e capacità"],["equipaggiamento","Equipaggiamento"]];if(state.char==="gorian")tabs.push(["dagon","Dagon"]);return tabs.map(([t,label])=>`<button type="button" class="tab ${state.tab===t?'active':''}" data-tab="${t}">${label}</button>`).join('')}
function renderCharacters(){const c=CHARACTERS[state.char],dog=state.char==="gorian"&&state.tab==="dagon";const head=dog?`<div class="sheethead dagon-head"><div class="portrait dagon-mark" aria-hidden="true">D</div><div><div class="eyebrow">Famiglio di Gorian</div><h1>Dagon</h1><p>Manifestazione d'Ombra · Mostruosità · Taglia Media</p><p>Compagno di Gorian, Patto della Catena.</p></div></div>`:`<div class="sheethead"><div class="portrait" aria-label="Ritratto di ${esc(c.name)}">${portrait(state.char)}</div><div><div class="eyebrow">Scheda del personaggio / Livello ${c.level}</div><h1>${esc(c.name)}</h1><p>${esc(c.race)} · ${esc(c.className)} / ${esc(c.subclass)}</p><p>${esc(c.bio)}</p>${state.char==='gorian'?'<button class="btn sm" type="button" data-open-dagon>Vedi Dagon</button>':''}</div></div>`;return `<section class="page-banner character-banner"><div class="eyebrow">WAXSKULL / PERSONAGGI</div><h1>Gli avventurieri</h1><p>Quattro storie, quattro destini.</p><div class="banner-sigil" aria-hidden="true">&#10022;</div></section><div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">Archivio del gruppo</div><h2>Le schede dei personaggi</h2></div></div><div class="char-layout"><aside class="sidebar"><div class="eyebrow">Scegli un personaggio</div><div class="people">${Object.entries(CHARACTERS).map(([id,ch])=>`<button type="button" class="personbtn ${id===state.char&&!dog?'active':''}" data-open-char="${id}"><span class="smallportrait">${portrait(id)}</span><span><strong>${esc(ch.name)}</strong><small>${esc(ch.className)} ${ch.level}</small></span></button>`).join('')}<button type="button" class="personbtn companion-link ${dog?'active':''}" data-open-dagon><span class="smallportrait dagon-mark" aria-hidden="true">D</span><span><strong>Dagon</strong><small>Famiglio di Gorian</small></span></button></div></aside><section class="sheet">${head}<div class="sheettabs">${charPageTabs()}</div><div class="sheetgrid"><div class="sheetmain stack">${dog?renderDagon():state.tab==='statistiche'?renderStats(c):state.tab==='combattimento'?renderCombat(c):state.tab==='magie'?renderMagic(c):renderEquipment(c)}</div><aside class="infoaside">${dog?renderDagonAside():renderHP(c)+renderResourceSummary(c)}</aside></div></section></div>`}
function renderStats(c){return `<div class="statstrip"><div class="stat-tile"><span class="val">${c.ac}</span><span class="lbl">Classe Armatura</span></div><div class="stat-tile"><span class="val">${c.ini===null?'?':fmt(c.ini)}</span><span class="lbl">Iniziativa</span></div><div class="stat-tile"><span class="val">${c.speed===null?'?':c.speed+' m'}</span><span class="lbl">Velocit\u00e0</span></div><div class="stat-tile"><span class="val">${c.passive}</span><span class="lbl">Percezione passiva</span></div><div class="stat-tile"><span class="val">+${c.prof}</span><span class="lbl">Competenza</span></div></div><section class="card panelcard"><div class="contentrow"><h3>Caratteristiche</h3></div><div class="abilities">${ABILITIES.map(([id,label],idx)=>`<div class="ability"><div class="abname">${label}</div><button type="button" data-roll="${Math.floor((c.abilities[idx]-10)/2)}" data-label="${label}" title="Tira 1d20 ${fmt(Math.floor((c.abilities[idx]-10)/2))}">${fmt(Math.floor((c.abilities[idx]-10)/2))}</button><div class="score">${c.abilities[idx]}</div></div>`).join('')}</div><div class="dicebox"><div><div class="eyebrow">Tiro rapido</div><div class="small muted">${esc(state.diceText||'Seleziona una caratteristica o una abilit\u00e0.')}</div></div><button class="btn sm" data-roll="0" data-label="D20 senza bonus">Tira d20</button></div></section><section class="card panelcard"><div class="contentrow"><h3>Abilit\u00e0</h3></div><div class="skills">${SKILLS.map((sk,i)=>`<div class="skill"><span class="prof-dot ${c.trained.includes(sk)?'yes':''}"></span><span>${esc(sk)}</span><button type="button" data-roll="${c.skills[i]}" data-label="${esc(sk)}">${fmt(c.skills[i])}</button></div>`).join('')}</div></section><section class="card panelcard"><h3>Tiri salvezza e dettagli</h3>${ABILITIES.map(([id,label],i)=>`<div class="minirow"><span>${label}</span><button class="btn sm ghost" data-roll="${c.saves[i]}" data-label="TS ${label}">${fmt(c.saves[i])} / tira</button></div>`).join('')}<div class="minirow"><span>Dadi Vita</span><strong>${c.hitdice}</strong></div><div class="minirow"><span>Lingue</span><strong>${c.language}</strong></div></section>`;}
function renderCombat(c){return `<section class="card panelcard"><h3>Azioni principali</h3><div class="stack">${c.attacks.map(detailItem).join('')}</div></section>${state.char==='gorian'?`<section class="card panelcard"><h3>Combattere con Dagon</h3>${quickRows([["Attacco + comando","Attacca con pugnale o Shadow Blade già attiva; usa la bonus per comandare Dagon."],["Hex e bonus","Nel turno in cui lanci o trasferisci Hex non puoi anche usare la bonus per Dagon. Puoi rinunciare a un attacco dell'azione Attacco e Dagon attacca con la propria reazione."],["Protezione","Quando Dagon subisce danno: reazione di Gorian + un utilizzo dei 2 per riposo lungo."]])}<button type="button" class="btn sm" data-open-dagon style="margin-top:12px">Apri Dagon</button></section>`:''}<section class="card panelcard"><h3>Regole rapide del combattimento</h3>${quickRows([["Azione","Una per turno: Attacco, Lanciare un Incantesimo, Scatto, Disimpegno, Schivata, Aiuto, Nascondersi, Preparare o altra azione."],["Azione bonus","Al massimo una per turno se una capacità la concede. Non puoi usare due capacità con questo costo nello stesso turno."],["Movimento","Puoi dividerlo prima e dopo l'azione fino alla tua velocità; terreno difficile normalmente costa il doppio."],["Reazione","Una, anche fuori turno; torna all'inizio del tuo turno. Un nemico visibile che esce dalla portata senza Disimpegno può provocare un attacco di opportunità."],["Attacco e critico","Tira d20 + bonus contro CA. Vantaggio: due d20, maggiore; svantaggio, minore. Non si cumulano e si annullano a vicenda. Critico: raddoppia i dadi di danno, non i modificatori fissi."]])}</section>`}
function renderMagic(c){const g=state.char==='gorian',e=state.char==='elara';return `<section class="card panelcard"><div class="contentrow"><div><div class="eyebrow">Magie e capacità</div><h3 style="margin:7px 0 4px">Le tue risorse</h3></div><div class="toolbar"><span class="pill neutral">CD ${c.spellDC}</span><span class="pill neutral">Attacco ${fmt(c.spellAttack)}</span></div></div><div class="stack">${resourcesFor(state.char).map(r=>resourceRow(state.char,r)).join('')}</div></section>${g?'<section class="card panelcard"><h3>Patto magico</h3><p class="spell-note">Due slot, entrambi di 2° livello. Ogni incantesimo conosciuto di 1° o 2° consuma uno slot; li recuperi con riposo breve o lungo. Trucchetti, Passo Fatato e richiamo di Dagon non consumano slot.</p></section>':''}<section class="card panelcard"><h3>${e?'Incantesimi nel libro':'Incantesimi'}</h3>${e?'<p class="spell-note">Con slot lanci le magie preparate; puoi lanciare i rituali del libro anche se non preparati.</p>':''}<div class="stack">${c.spells.map(detailItem).join('')}</div></section>${c.cantrips.length?`<section class="card panelcard"><h3>Trucchetti</h3><div class="stack">${c.cantrips.map(detailItem).join('')}</div></section>`:''}<section class="card panelcard"><h3>Capacità e tratti</h3><div class="stack">${c.features.map(detailItem).join('')}</div></section><section class="card panelcard"><h3>Regole rapide della magia</h3>${quickRows([["CD e tiro per colpire","TS: il bersaglio tira contro CD "+c.spellDC+". Attacco magico: tu tiri 1d20 "+fmt(c.spellAttack)+" contro CA."],["Concentrazione","Una magia a concentrazione alla volta. Ogni danno subito: TS COS CD 10 o metà del danno, il valore maggiore. Fallimento, morte o incapacità fanno terminare l'effetto."],["Magia con azione bonus","Se lanci un incantesimo con la bonus, nello stesso turno puoi lanciare un altro incantesimo solo se è un trucchetto da 1 azione. Puoi comunque attaccare con un'arma."],["Componenti","V = verbale, S = somatica, M = materiale. Focus sostituisce i materiali senza prezzo e non consumati, quando appropriato. I materiali consumati o con costo vanno forniti."]])}</section>`}
function detailItem(x){const tags=[x.tier,x.time||x.kind,x.toHit,x.damage].filter(Boolean);const meta=[["Costo",x.cost],["Portata",x.range],["Durata",x.duration],["Concentrazione",x.concentration],["Componenti",x.components]].filter(([,v])=>v);const more=meta.length||x.steps?.length||x.example||x.notes||x.companion;return `<article class="item action-detail${x.featured?' key-spell':''}"><div class="contentrow"><strong>${esc(x.name)}</strong><div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><p>${esc(x.desc)}</p>${more?`<details class="howto"${x.featured?' open':''}><summary>Come si usa</summary>${meta.length?`<dl class="spell-meta">${meta.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:''}${x.steps?.length?`<ol class="action-steps">${x.steps.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:''}${x.example?`<div class="spell-example"><b>Esempio</b><p>${esc(x.example)}</p></div>`:''}${x.notes?`<p class="spell-note"><b>Attenzione:</b> ${esc(x.notes)}</p>`:''}${x.companion?'<button type="button" class="btn sm" data-open-dagon>Apri la scheda di Dagon</button>':''}</details>`:''}</article>`}
function quickRows(rows){return `<div class="simplelist">${rows.map(([k,v])=>`<div class="simpleitem"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}</div>`}
function renderDagon(){const d=DAGON;return `<div class="statstrip">${[["CA",13],["PF massimi",16],["Velocità","12 m"],["Percezione passiva",13],["Dadi vita","3d8"]].map(([k,v])=>`<div class="stat-tile"><span class="val">${v}</span><span class="lbl">${k}</span></div>`).join('')}</div><section class="card panelcard"><h3>Caratteristiche</h3><div class="abilities">${ABILITIES.map(([id,l],i)=>`<div class="ability"><div class="abname">${esc(l)}</div><button type="button" data-roll="${Math.floor((d.abilities[i]-10)/2)}" data-label="Dagon — ${esc(l)}">${fmt(Math.floor((d.abilities[i]-10)/2))}</button><div class="score">${d.abilities[i]}</div></div>`).join('')}</div><div style="margin-top:12px"><div class="minirow"><span>Percezione</span><button class="btn sm ghost" data-roll="3" data-label="Dagon — Percezione">+3 / tira</button></div><div class="minirow"><span>Furtività</span><button class="btn sm ghost" data-roll="4" data-label="Dagon — Furtività">+4 / tira</button></div><div class="minirow"><span>Scurovisione</span><strong>36 m</strong></div><div class="minirow"><span>Resistenza</span><strong>Necrotico</strong></div></div></section><section class="card panelcard"><h3>Attacco</h3>${detailItem(d.bite)}</section><section class="card panelcard"><h3>Comandi e protezione</h3><div class="stack">${d.commands.map(detailItem).join('')}</div><div class="spell-example"><b>Esempio di round</b><p>Gorian attacca con la propria azione e comanda Dagon con la bonus; Dagon morde nel suo turno. Se poi un nemico colpisce Dagon, Gorian usa la propria reazione e un utilizzo disponibile di Protezione. Gorian e Dagon hanno ciascuno una reazione, recuperata all'inizio del rispettivo turno.</p></div></section><section class="card panelcard"><h3>Tratti passivi</h3><div class="stack">${d.traits.map(detailItem).join('')}</div></section><section class="card panelcard"><h3>Evocazione e recupero</h3><div class="stack">${d.manifest.map(detailItem).join('')}</div></section>`}
function renderDagonAside(){return `${hpPanel('dagon')}<div class="card panelcard tracker-panel"><h3>Risorse disponibili</h3><div class="simplelist tracker-resources">${resourceRow('gorian',{id:'protection',label:'Protezione di Dagon',max:2,hint:'2 usi per riposo lungo; richiede la reazione di Gorian.'})}${resourcesFor('dagon').map(r=>resourceRow('dagon',r,true)).join('')}</div><div class="minirow"><span>Attacchi per round</span><strong>1</strong></div><button type="button" class="btn sm" data-open-char="gorian" style="margin-top:12px;width:100%">Torna a Gorian</button></div>`;}
function renderEquipment(c){return `<section class="card panelcard"><div class="eyebrow">Oggetti del personaggio</div><h3 style="margin-top:8px">Equipaggiamento documentato</h3><div class="equipment">${c.equipment.map(item=>`<div>${esc(item)}</div>`).join('')}</div></section>`;}
function renderHP(c){return hpPanel(state.char);}
function getRes(id,res){return state.resources[id]?.[res]??''}
function resourceRow(id,r,compact=false){return `<div class="simpleitem tracker-resource${compact?' compact':''}"><div class="tracker-resource-label"><b>${esc(r.label)}</b>${compact?'':`<p>${esc(r.hint)}</p>`}</div>${trackerControl(id,r.id)}</div>`;}
function renderResourceSummary(c){return `<div class="card panelcard tracker-panel"><h3>Risorse disponibili</h3><div class="simplelist tracker-resources">${resourcesFor(state.char).map(r=>resourceRow(state.char,r,true)).join('')}</div><button type="button" class="btn sm" data-tab="magie" style="margin-top:11px;width:100%">Vedi magie e capacità</button></div>`;}
function renderGallery(){return `<section class="page-banner"><div class="eyebrow">WAXSKULL / GALLERIA</div><h1>Volti dell'avventura</h1><p>I protagonisti della campagna.</p><div class="banner-sigil" aria-hidden="true">&#10022;</div></section><div class="sectionhead"><div><div class="eyebrow">I VOSTRI PERSONAGGI</div><h2>Quattro destini</h2></div></div><div class="gallery-grid portrait-gallery">${['elara','gorian','rey','white'].map(id=>{const c=CHARACTERS[id];return `<button class="gallery-portrait" data-open-char="${id}" type="button"><span class="gallery-picture">${portrait(id)}</span><span class="gallery-bottom"><strong>${c.name}</strong><span>${esc(c.race)} &middot; ${esc(c.className)} ${c.level}</span></span></button>`}).join('')}</div>${state.gallery.length?`<div class="sectionhead"><div><div class="eyebrow">ARCHIVIO VISIVO</div><h2>Immagini dell'avventura</h2></div></div><div class="gallery-grid">${state.gallery.map(g=>`<article class="card gallerycard"><img loading="lazy" src="${g.data}" alt="${esc(g.title)}"><div class="gbody"><h3>${esc(g.title||'Immagine della campagna')}</h3>${g.caption?`<p>${esc(g.caption)}</p>`:''}</div></article>`).join('')}</div>`:''}`;}
function handleClick(e){if(handleTrackStep(e))return;const a=e.target.closest('[data-page]');if(a){navigate(a.dataset.page);return}const d=e.target.closest('[data-open-dagon]');if(d){state.tab='dagon';navigate('personaggi','gorian');return}const b=e.target.closest('[data-open-char]');if(b){state.tab='statistiche';navigate('personaggi',b.dataset.openChar);return}const c=e.target.closest('[data-tab]');if(c){state.tab=c.dataset.tab;render();return}const roll=e.target.closest('[data-roll]');if(roll){const die=1+Math.floor(Math.random()*20),bonus=n(roll.dataset.roll),label=roll.dataset.label;state.diceText=`${label}: d20 ${die} ${fmt(bonus)} = ${die+bonus}`;render();toast(state.diceText);return}}
document.addEventListener('click',handleClick);document.addEventListener('input',handleTrackInput);document.addEventListener('change',handleTrackInput);document.addEventListener('focusout',handleTrackInput);window.addEventListener('storage',handleTrackingStorage);document.getElementById('goHome').addEventListener('click',()=>navigate('home'));
render();
</script>
</body>
</html>
