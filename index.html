// Shared player copy: read-only interface. The Master changes the canonical HTML source.
// MASTER IMAGE DATA: edit #embedded-state from the master source only (portraits, cover, gallery).
const DEFAULT={v:1,updatedAt:0,page:'diario',char:'white',tab:'statistiche',portraits:{},gallery:[],cover:'',notes:{},hp:{},temp:{},resources:{},diceText:'',recapNote:''};
function readEmbedded(){try{return JSON.parse(document.getElementById('embedded-state').textContent||'{}')}catch(e){return {}}}
function normalize(raw){const base=JSON.parse(JSON.stringify(DEFAULT));if(!raw||typeof raw!=='object')return base;const out={...base,...raw};for(const k of ['portraits','notes','hp','temp','resources'])if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]={};if(!Array.isArray(out.gallery))out.gallery=[];out.page=['diario','personaggi','galleria','istruzioni'].includes(out.page)?out.page:'diario';out.char=CHARACTERS[out.char]?out.char:'white';return out;}
let state=normalize(readEmbedded());
function esc(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(v){if(v===null||v===undefined||v==='')return '\u2014';return Number(v)>=0?'+'+v:String(v)}
function n(v){const r=Number(v);return Number.isFinite(r)?r:0}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function portrait(id,large=false){let val=state.portraits[id];return val?`<img src="${val}" alt="Ritratto di ${esc(CHARACTERS[id].name)}">`:`<span aria-hidden="true">${esc(CHARACTERS[id].name[0])}</span>`}
function navigate(page,char){if(page)state.page=page;if(char)state.char=char;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const app=document.getElementById('app');app.innerHTML=state.page==='diario'?renderDiary():state.page==='personaggi'?renderCharacters():state.page==='galleria'?renderGallery():renderHelp();}
function renderDiary(){const cover=state.cover?`style="background-image:url('${state.cover}')"`:'';return `<section class="hero ${state.cover?'with-image':''}" ${cover}><div><div class="eyebrow">Diario della campagna / Ultima sessione giocata</div><h1>La galleria.<br>Il silenzio.<br>L'accampamento.</h1><p>10 novembre 2026: dopo una lunga pausa, il gruppo torna a riunirsi. Una parete nasconde una camera, quattro scheletri rispondono al trambusto e oltre la montagna li attende un accampamento devastato.</p><div class="hero-actions"><button class="btn gold" data-page="personaggi">Apri le schede</button></div></div><div class="hero-art"><div class="sigil">W</div></div></section>
<div class="sectionhead"><div><div class="eyebrow">Cronaca / Sessione 10.11.2026</div><h2>Quello che avete vissuto</h2></div><p>Resoconto condiviso, senza segreti del Master e senza anticipazioni sulla prossima sessione.</p></div>
<div class="layout2"><article class="card storycard"><div class="eyebrow">Ultima sessione</div><h3>Tra le pareti della montagna</h3><p class="storyintro">Elara cerca Altea nella galleria, mentre White, Rey e Gorian si ricongiungono. Un richiamo, una voce soffocata nella roccia e un varco nascosto cambiano il corso del viaggio.</p><div class="gold-rule"></div>
<div class="timeline"><div class="step"><span class="stepbadge">1</span><div class="steptext"><strong>Il gruppo si ritrova</strong><p>Elara raggiunge l'uscita della galleria senza trovare Altea e la chiama ad alta voce, storpiandone il nome in \u00abAlbenga\u00bb. Rey, White e Gorian sentono il richiamo e si dirigono verso di lei.</p></div></div>
<div class="step"><span class="stepbadge">2</span><div class="steptext"><strong>La parete nascosta</strong><p>White recupera dell'ossidiana da una roccia spezzata e sente una voce ovattata dopo aver chiamato Altea in una rientranza. Rey nota una melma mimetizzata con la parete; White la distrugge, aprendo l'accesso a una camera laterale.</p></div></div>
<div class="step"><span class="stepbadge">3</span><div class="steptext"><strong>Una scoperta inquietante</strong><p>Dietro il varco si distinguono i piedi e parte delle gambe di Altea. Il resto del corpo \u00e8 nascosto sotto un enorme masso.</p></div></div>
<div class="step"><span class="stepbadge">4</span><div class="steptext"><strong>Quattro scheletri</strong><p>Il rumore risveglia quattro scheletri, alcuni provenienti da fessure nascoste nella parete. L'odore dei cadaveri emerge dopo la distruzione della melma. I quattro avventurieri vincono lo scontro; uno scheletro rimane intrappolato.</p></div></div>
<div class="step"><span class="stepbadge">5</span><div class="steptext"><strong>Di nuovo insieme</strong><p>Gorian racconta agli altri quanto ha vissuto durante la separazione e indica Vibruyl come sua meta. Elara recupera il proprio bastone magico, precedentemente raccolto da White.</p></div></div>
<div class="step"><span class="stepbadge">6</span><div class="steptext"><strong>Il campo devastato</strong><p>Usciti dalla galleria, i quattro raggiungono un accampamento distrutto. Vedono corpi senza vita e un focolare spento con braci ancora ardenti.</p></div></div></div></article>
<aside class="stack"><div class="card at-glance"><div class="eyebrow">Dove siete rimasti</div><h3 style="margin:8px 0 12px">Il prossimo passo \u00e8 vostro</h3><div class="simplelist"><div class="simpleitem"><b>Posizione</b><p>Accampamento distrutto, oltre la galleria montana. Non avete ancora esaminato in dettaglio la scena.</p></div><div class="simpleitem"><b>Compagni presenti</b><p>White, Gorian, Rey, Elara. Il gruppo \u00e8 finalmente riunito.</p></div><div class="simpleitem"><b>Questioni aperte</b><p>Che cosa \u00e8 accaduto al campo?</p></div></div></div><div class="card at-glance"><div class="eyebrow">Momento della serata</div><h3 style="margin:8px 0 11px">\u00abMi son sempre piaciuti i secchi\u00bb</h3><p class="muted" style="line-height:1.7;font-size:12px">Rey, rivolgendosi a uno scheletro durante il combattimento. La frase \u00e8 stata davvero pronunciata al tavolo.</p></div></aside></div>
<div class="sectionhead"><div><div class="eyebrow">Il vostro gruppo</div><h2>Quattro destini, una storia</h2></div><p>Seleziona un personaggio per consultare statistiche, attacchi, magie e oggetti.</p></div><div class="roster">${Object.entries(CHARACTERS).map(([id,c])=>`<button class="roster-card" data-open-char="${id}"><div class="roster-image">${state.portraits[id]?portrait(id):`<span class="roster-initial">${c.name[0]}</span>`}</div><div class="roster-body"><div class="roster-name">${c.name}</div><div class="roster-class">${esc(c.race)} \u00b7 ${esc(c.className)} ${c.level}</div><div class="roster-stats"><span>CA ${c.ac}</span><span>PF max ${c.hp}${id==='rey'?'*':''}</span></div></div></button>`).join('')}</div>`;}
function charPageTabs(){return ['statistiche','combattimento','magie','equipaggiamento'].map(t=>`<button type="button" class="tab ${state.tab===t?'active':''}" data-tab="${t}">${({statistiche:'Statistiche',combattimento:'Combattimento',magie:'Magie e capacit\u00e0',equipaggiamento:'Equipaggiamento'})[t]}</button>`).join('')}
function renderCharacters(){const c=CHARACTERS[state.char];return `<div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">Archivio del gruppo</div><h2>Le schede dei personaggi</h2></div><p>Valori dalle schede conservate della campagna (2014). I dati incompleti rimangono da verificare con il Master.</p></div><div class="char-layout"><aside class="sidebar"><div class="eyebrow">Scegli un personaggio</div><div class="people">${Object.entries(CHARACTERS).map(([id,ch])=>`<button type="button" class="personbtn ${id===state.char?'active':''}" data-open-char="${id}"><span class="smallportrait">${portrait(id)}</span><span><strong>${ch.name}</strong><small>${esc(ch.className)} ${ch.level}</small></span></button>`).join('')}</div><div class="card help">Questa versione \u00e8 in <b>sola lettura</b>. Tutte le modifiche sono gestite dal Master.</div></aside><section class="sheet"><div class="sheethead"><div class="portrait" aria-label="Ritratto di ${esc(c.name)}">${portrait(state.char)}</div><div><div class="eyebrow">Scheda del personaggio / Livello ${c.level}</div><h1>${c.name}</h1><p>${esc(c.race)} \u00b7 ${esc(c.className)} / ${esc(c.subclass)}</p><p>${esc(c.bio)}</p><div class="headtags">${c.tags.map(t=>`<span class="pill neutral">${esc(t)}</span>`).join('')}</div></div></div><div class="sheettabs">${charPageTabs()}</div><div class="sheetgrid"><div class="sheetmain stack">${state.tab==='statistiche'?renderStats(c):state.tab==='combattimento'?renderCombat(c):state.tab==='magie'?renderMagic(c):renderEquipment(c)}</div><aside class="infoaside">${renderHP(c)}${renderResourceSummary(c)}<section class="card panelcard"><h3>Da sapere</h3><div class="stack">${c.warnings.map(w=>`<div class="note">${esc(w)}</div>`).join('')}</div></section></aside></div></section></div>`;}
function renderStats(c){return `<div class="statstrip"><div class="stat-tile"><span class="val">${c.ac}</span><span class="lbl">Classe Armatura</span></div><div class="stat-tile"><span class="val">${c.ini===null?'?':fmt(c.ini)}</span><span class="lbl">Iniziativa</span></div><div class="stat-tile"><span class="val">${c.speed===null?'?':c.speed+' m'}</span><span class="lbl">Velocit\u00e0</span></div><div class="stat-tile"><span class="val">${c.passive}</span><span class="lbl">Percezione passiva</span></div><div class="stat-tile"><span class="val">+${c.prof}</span><span class="lbl">Competenza</span></div></div><section class="card panelcard"><div class="contentrow"><h3>Caratteristiche</h3><span class="small muted">Clicca su un modificatore per tirare 1d20</span></div><div class="abilities">${ABILITIES.map(([id,label],idx)=>`<div class="ability"><div class="abname">${label}</div><button type="button" data-roll="${Math.floor((c.abilities[idx]-10)/2)}" data-label="${label}" title="Tira 1d20 ${fmt(Math.floor((c.abilities[idx]-10)/2))}">${fmt(Math.floor((c.abilities[idx]-10)/2))}</button><div class="score">${c.abilities[idx]}</div></div>`).join('')}</div><div class="dicebox"><div><div class="eyebrow">Tiro rapido</div><div class="small muted">${esc(state.diceText||'Seleziona una caratteristica o una abilit\u00e0.')}</div></div><button class="btn sm" data-roll="0" data-label="D20 senza bonus">Tira d20</button></div></section><section class="card panelcard"><div class="contentrow"><h3>Abilit\u00e0</h3><span class="small muted">Il punto dorato indica la competenza registrata.</span></div><div class="skills">${SKILLS.map((sk,i)=>`<div class="skill"><span class="prof-dot ${c.trained.includes(sk)?'yes':''}"></span><span>${esc(sk)}</span><button type="button" data-roll="${c.skills[i]}" data-label="${esc(sk)}">${fmt(c.skills[i])}</button></div>`).join('')}</div></section><section class="card panelcard"><h3>Tiri salvezza e dettagli</h3>${ABILITIES.map(([id,label],i)=>`<div class="minirow"><span>${label}</span><button class="btn sm ghost" data-roll="${c.saves[i]}" data-label="TS ${label}">${fmt(c.saves[i])} / tira</button></div>`).join('')}<div class="minirow"><span>Dadi Vita</span><strong>${c.hitdice}</strong></div><div class="minirow"><span>Lingue</span><strong>${c.language}</strong></div></section>`;}
function renderCombat(c){return `<section class="card panelcard"><div class="eyebrow">Attacchi e danni</div><h3 style="margin-top:8px">Azioni principali</h3><div class="stack">${c.attacks.map(a=>`<div class="item"><div class="contentrow"><strong>${esc(a.name)}</strong><span class="pill">${esc(a.toHit)}</span></div><div class="itemmeta"><span class="tag">${esc(a.damage)}</span></div><p>${esc(a.desc)}</p></div>`).join('')}</div></section><section class="card panelcard"><h3>Regole rapide del combattimento</h3><div class="simplelist"><div class="simpleitem"><b>Una azione e un movimento</b><p>Puoi muoverti e agire nello stesso turno; l'azione bonus richiede una capacit\u00e0 specifica che la consenta.</p></div><div class="simpleitem"><b>Attacchi di opportunit\u00e0</b><p>Allontanarti dalla portata di un nemico pu\u00f2 provocare un attacco di opportunit\u00e0, salvo Disimpegno o altre eccezioni.</p></div><div class="simpleitem"><b>Riposi e risorse</b><p>I PF e gli slot residui dopo lo scontro del 10 novembre non sono stati ricostruiti. Concordate lo stato effettivo con il Master, senza ripristinarlo automaticamente.</p></div></div></section>`;}
function renderMagic(c){return `<section class="card panelcard"><div class="contentrow"><div><div class="eyebrow">Magie e capacit\u00e0</div><h3 style="margin:7px 0 4px">Le tue risorse</h3></div><div class="toolbar"><span class="pill neutral">CD ${c.spellDC}</span><span class="pill neutral">Attacco ${fmt(c.spellAttack)}</span></div></div><div class="stack">${c.resources.map(r=>resourceRow(state.char,r)).join('')}</div><p class="attribute-note">I valori rimasti sono mostrati quando vengono confermati e aggiornati dal Master.</p></section><section class="card panelcard"><h3>Capacit\u00e0 e tratti</h3><div class="stack">${c.features.map(f=>`<div class="item"><strong>${esc(f.name)}</strong><div class="itemmeta"><span class="tag">${esc(f.kind)}</span></div><p>${esc(f.desc)}</p></div>`).join('')}</div></section><section class="card panelcard"><h3>Trucchetti</h3>${c.cantrips.length?`<div class="stack">${c.cantrips.map(spellItem).join('')}</div>`:'<p class="muted small">I trucchetti non sono documentati completamente nella scheda disponibile. Non sono stati inventati.</p>'}</section><section class="card panelcard"><h3>Incantesimi riportati</h3><div class="stack">${c.spells.map(spellItem).join('')}</div><p class="attribute-note">La lista segue i documenti ricevuti e non certifica quali incantesimi siano preparati o quanti slot siano rimasti.</p></section>`;}
function spellItem(s){return `<div class="item"><div class="contentrow"><strong>${esc(s.name)}</strong><div class="tags"><span class="tag">${esc(s.tier)}</span><span class="tag">${esc(s.time)}</span></div></div><p>${esc(s.desc)}</p></div>`;}
function renderEquipment(c){return `<section class="card panelcard"><div class="eyebrow">Oggetti del personaggio</div><h3 style="margin-top:8px">Equipaggiamento documentato</h3><div class="equipment">${c.equipment.map(item=>`<div>${esc(item)}</div>`).join('')}</div><div class="rule"></div><div class="note">${esc(c.inventoryNote)}</div></section>`;}
function renderHP(c){const id=state.char;const cur=state.hp[id]??'';const temp=state.temp[id]??'';const known=cur!==''&&cur!==undefined;const width=known?Math.min(100,Math.max(0,n(cur)/c.hp*100)):0;return `<div class="card panelcard"><div class="eyebrow">Stato attuale</div><div class="hp-row" style="margin:8px 0 4px"><h3 style="margin:0">Punti ferita</h3><span class="pill ${known?'good':'neutral'}">${known?'Registrati dal Master':'Da verificare'}</span></div><div class="hp-row"><span class="muted small">Attuali</span><strong>${known?esc(cur):'Non registrati'}</strong></div><div class="hpbar"><span style="width:${width}%"></span></div><div class="hp-row"><span class="muted small">PF massimi</span><strong>${c.hp}${id==='rey'?'*':''}</strong></div><div class="hp-row"><span class="muted small">PF temporanei</span><strong>${temp===''?'Non registrati':esc(temp)}</strong></div>${id==='rey'?'<p class="attribute-note">* 14 PF stampati nel PDF, da verificare col Master per le regole 2014.</p>':''}<p class="attribute-note">Solo il Master aggiorna i valori della scheda condivisa.</p></div>`;}
function getRes(id,res){return state.resources[id]?.[res]??''}
function resourceRow(id,r){const value=getRes(id,r.id);return `<div class="simpleitem"><div class="contentrow"><div><b>${esc(r.label)}</b><p>${esc(r.hint)}</p></div><span class="pill neutral">${value===''?'Da verificare':esc(value)} / ${r.max}</span></div></div>`;}
function renderResourceSummary(c){return `<div class="card panelcard"><h3>Risorse rapide</h3><div class="simplelist">${c.resources.slice(0,3).map(r=>`<div class="minirow"><span>${esc(r.label)}</span><strong>${getRes(state.char,r.id)===''?'—':getRes(state.char,r.id)} / ${r.max}</strong></div>`).join('')}</div><button type="button" class="btn sm" data-tab="magie" style="margin-top:11px;width:100%">Vedi magie e capacit\u00e0</button></div>`;}
function renderGallery(){return `<div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">Album dell'avventura</div><h2>Galleria della campagna</h2></div><p>Illustrazioni, mappe e immagini della storia selezionate dal Master.</p></div>${state.gallery.length?`<div class="gallery-grid">${state.gallery.map(g=>`<article class="card gallerycard"><img loading="lazy" src="${g.data}" alt="${esc(g.title)}"><div class="gbody"><h3>${esc(g.title||'Immagine della campagna')}</h3>${g.caption?`<p>${esc(g.caption)}</p>`:''}</div></article>`).join('')}</div>`:'<div class="empty"><div class="eyebrow">Galleria</div><b>Le immagini dell’avventura troveranno posto qui.</b><span class="small">Le immagini saranno pubblicate dal Master.</span></div>'}`;}
function renderHelp(){return `<div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">Guida dei giocatori</div><h2>Consultare il portale</h2></div><p>Un unico archivio della campagna, utilizzabile in un browser e anche offline.</p></div><div class="instructions"><div class="card"><div style="padding:24px"><div class="eyebrow">01 / Diario</div><h3>La sessione precedente</h3><p>Leggi il riepilogo dell'ultima sessione realmente giocata. Non contiene anticipazioni della prossima avventura.</p></div></div><div class="card"><div style="padding:24px"><div class="eyebrow">02 / Schede</div><h3>Personaggi in consultazione</h3><p>Apri le schede di White, Gorian, Rey ed Elara: caratteristiche, tiri salvezza, abilit\u00e0, attacchi, magie e oggetti.</p><p>Puoi lanciare un d20 locale cliccando un modificatore. Questo non modifica la scheda ufficiale.</p></div></div><div class="card"><div style="padding:24px"><div class="eyebrow">03 / Immagini</div><h3>Ritratti e galleria</h3><p>Le immagini condivise dal Master appariranno nei ritratti, in copertina e nella galleria. Non sono previste modifiche da parte dei giocatori.</p></div></div><div class="card"><div style="padding:24px"><div class="eyebrow">04 / Aggiornamenti</div><h3>Una sola versione ufficiale</h3><p>Il portale \u00e8 di <b>sola lettura</b>: solo il Master aggiorna cronache, immagini e schede. Quando ricevi una nuova versione, sostituisci il file precedente o apri l'indirizzo aggiornato comunicato dal Master.</p></div></div></div><div class="note" style="margin-top:17px">Archivio di consultazione non affiliato a D&amp;D Beyond. I contenuti sono aggiornati dal Master e derivano dagli eventi e dalle schede della campagna.</div>`;}
function handleClick(e){const a=e.target.closest('[data-page]');if(a){navigate(a.dataset.page);return}const b=e.target.closest('[data-open-char]');if(b){state.tab='statistiche';navigate('personaggi',b.dataset.openChar);return}const c=e.target.closest('[data-tab]');if(c){state.tab=c.dataset.tab;render();return}const roll=e.target.closest('[data-roll]');if(roll){const die=1+Math.floor(Math.random()*20),bonus=n(roll.dataset.roll),label=roll.dataset.label;state.diceText=`${label}: d20 ${die} ${fmt(bonus)} = ${die+bonus}`;render();toast(state.diceText);return}}
document.addEventListener('click',handleClick);document.getElementById('goHome').addEventListener('click',()=>navigate('diario'));
render();
</script>
</body>
</html>
