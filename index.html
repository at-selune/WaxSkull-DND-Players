<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Teschi di Cera — Portale giocatori in configurazione</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#282337,#10131d 70%);color:#ede5d7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px}
    main{max-width:620px;text-align:center;padding:46px 38px;border:1px solid #5a4b49;border-radius:16px;background:#131723d9;box-shadow:0 30px 110px #0008}
    .mark{font-size:38px;color:#d9bf8b;letter-spacing:.26em;font-family:Georgia,serif}
    h1{font-family:Georgia,serif;font-size:clamp(2.1rem,5vw,3.3rem);font-weight:normal;letter-spacing:.02em;margin:14px 0}
    p{font-size:1.05rem;color:#c1bbbd;line-height:1.7}
    small{display:block;margin-top:30px;color:#948c91;font-size:.85rem}
    hr{border:0;border-top:1px solid #53434c;margin:28px auto;max-width:200px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Teschi di Cera</h1>
    <p>Il portale dei giocatori è in configurazione.</p>
    <hr>
    <p>Questa pagina provvisoria non contiene alcun materiale della campagna.</p>
    <small>Accesso al portale definitivo riservato alle persone autorizzate.</small>
  </main>
</body>
</html>
